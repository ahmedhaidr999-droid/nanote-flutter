name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-flutter-3.22.3
          restore-keys: gradle-flutter-3.22.3

      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.nanote --project-name nanote .
          fi
          sed -i 's/android:label="nanote"/android:label="Nanote"/' android/app/src/main/AndroidManifest.xml || true

      - name: Pub get
        run: flutter pub get

      - name: Code generation (Riverpod + Isar + Freezed)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanote-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Nanote v1.0.0 — Android APK
          body: |
            **Nanote** — offline-first, vector-based note-taking. 100% local. No cloud. No AI.

            **Install:** download `app-release.apk` below, open it on your Android device/tablet and allow "Install unknown apps" if prompted.

            Built automatically from the `main` branch by GitHub Actions.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
