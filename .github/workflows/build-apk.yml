name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-flutter-3.22.3
          restore-keys: gradle-flutter-3.22.3

      - name: Generate Android platform files
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.nanote --project-name nanote .
          fi
          sed -i 's/android:label="nanote"/android:label="Nanote"/' android/app/src/main/AndroidManifest.xml || true

      - name: Pub get
        run: flutter pub get

      - name: Code generation (Riverpod + Isar + Freezed)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanote-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: Nanote v1.3.0 — Android APK
          body: |
            **Nanote** — offline-first, vector-based note-taking. 100% local. No cloud. No AI.

            **v1.3.0 — XNota feature parity, wave 1**
            - 🖌 **8 pen styles** — Pen · Pencil · Calligraphy nib (45°) · Neon glow · Dashed · Speed brush (fast = thin) · Taper (feathered ends) · Rainbow — live mini-preview chips in the toolbar, persisted per stroke, included in exports & thumbnails.
            - ◐ **Pen opacity** — 100 / 60 / 35 presets beside the size row.
            - 🗒 **Sticky notes** — text tool's sticky mode drops colored sticky notes anywhere; tap to edit, drag to move, 5 pastel colors.
            - 📄 **Offline export** — "Export as PDF" (all pages: paper template, embedded original PDF content, ink with per-style width profiles, text & stickies) and "Save page as PNG" (2× render through the real painter). 100% local, system save dialog only.
            - 🗑 **Trash** — deleted notes move to Trash (restore / delete forever / empty); deleting a folder keeps its notes restorable. New trash screen from the library.
            - ✨ Stroke-start **haptic tick** and **keep-screen-awake** while a note is open.
            - 🎨 Kept from v1.2.0: floating Notewise-style chrome, hand tool, shapes, text tool, thumbnails rail, read mode, zoom menu, edge arrows, springy page turns, palm rejection with the frozen pager.

            **Install:** download `app-release.apk` below, open it on your Android device/tablet and allow "Install unknown apps" if prompted.

            Built automatically from the `main` branch by GitHub Actions.
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
